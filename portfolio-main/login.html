
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Poojitha's Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #34495e);
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #243447;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #5478e8;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #34495e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #243447;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #34495e;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to access my portfolio</p>

        <form id="loginForm" action="/login" method="POST">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>
        <div style="text-align: center; margin-top: 20px;">
    <p>OR</p>

    <a href="/auth/google"
       style="display: inline-block;
              background-color: #4285F4;
              color: white;
              padding: 12px 25px;
              border-radius: 6px;
              text-decoration: none;
              font-weight: bold;">
        Continue with Google
    </a>
</div>

        <a class="back-link" href="index.html">
            Back to Portfolio
        </a>
    </div>
</body>
</html>
